<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checklist Onboarding</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 24px; color: #0f172a; background: #fff; }
      a { color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .container { max-width: 820px; margin: 0 auto; }
      .title { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
      .subtitle { color: #475569; margin-bottom: 24px; }
      ol { padding-left: 0; }
      li { list-style: none; }
      .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; gap: 10px; }
      .card + .card { margin-top: 12px; }
      .label { display: flex; gap: 12px; align-items: flex-start; width: 100%; }
      .title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .step-title { font-weight: 600; }
      .desc { margin: 6px 0 0 0; white-space: pre-line; color: #334155; }
      .link { font-size: 14px; }
      .footer { margin-top: 24px; font-size: 13px; color: #64748b; }
      .actions { display: flex; gap: 8px; margin-bottom: 16px; }
      .btn { border: 1px solid #cbd5e1; background: #f8fafc; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
      .btn:hover { background: #eef2f7; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">Checklist de Onboarding</div>
      <div class="subtitle">Marca cada paso conforme lo completes. Se guarda automáticamente en este navegador.</div>
      <div id="root"></div>
      <div class="footer">Si borras el almacenamiento del navegador, se perderán los checks.</div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="./app.jsx"></script>
  </body>
  </html>
